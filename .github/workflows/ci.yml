name: CI
on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          additional_files: 'checklist.sh'
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard — no secrets/hosts committed
        run: |
          if grep -rniE 'getsec\.io|synology\.me|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}|config\.env$' \
             --include='*.sh' --include='*.ps1' --exclude-dir=.git . ; then
            echo "::error::possible secret or internal host committed"; exit 1
          fi
          echo "clean"
