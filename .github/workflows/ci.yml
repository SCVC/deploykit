name: CI
on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        continue-on-error: true    # advisory for the initial import of legacy scripts; clean up incrementally
        with:
          severity: error
          additional_files: 'checklist.sh'

  shell-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shebang (enforced) + set -u (recommended)
        run: |
          fail=0
          while IFS= read -r f; do
            if ! head -1 "$f" | grep -qE '^#!'; then
              echo "::error file=$f::missing shebang"; fail=1
            fi
            if ! grep -qE '^[[:space:]]*set[[:space:]]+-[a-z]*u' "$f"; then
              echo "::warning file=$f::no 'set -u' (recommend: set -euo pipefail)"
            fi
          done < <(git ls-files '*.sh')
          [ "$fail" -eq 0 ] && echo "shell hygiene OK"
          exit "$fail"

  powershell-lint:
    runs-on: ubuntu-latest    # ships pwsh preinstalled
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell (syntax — enforcing)
        shell: pwsh
        run: |
          $bad = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $bad = $true; $errs | ForEach-Object { Write-Host "::error file=$($_.Extent.File)::$($_.Message)" } }
            else { Write-Host "ok: $($_.FullName)" }
          }
          if ($bad) { exit 1 }
      - name: PSScriptAnalyzer (advisory)
        shell: pwsh
        continue-on-error: true    # advisory, like shellcheck — warnings don't block
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning,Error | Format-Table -AutoSize
          }

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard — no secrets or internal hosts committed
        run: |
          # config.env must never be tracked (only config.env.example)
          if git ls-files | grep -qxE 'config\.env'; then
            echo "::error::config.env is tracked — it must be git-ignored"; exit 1
          fi
          # no internal hosts or known leaked tokens/keys in scripts
          if grep -rniE 'getsec\.io|synology\.me|vcrust|vcsiem|66a759e3-|0166e7f7-|IIkzfjn8' \
             --include='*.sh' --include='*.ps1' --exclude-dir=.git . ; then
            echo "::error::internal host or known secret found in a script"; exit 1
          fi
          # generic secret shapes: private keys, cloud/vendor tokens
          if grep -rniE --include='*.sh' --include='*.ps1' --include='*.md' --include='*.xml' --exclude-dir=.git \
             -e '-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|xox[baprs]-[0-9A-Za-z-]{10,}|ghp_[0-9A-Za-z]{36}|AIza[0-9A-Za-z_-]{35}' . ; then
            echo "::error::a generic secret pattern (private key / cloud token) was found"; exit 1
          fi
          echo "clean — no secrets or internal hosts committed"
